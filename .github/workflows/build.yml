name: Build & Release

permissions:
  actions: read
  pull-requests: write
  security-events: write
  contents: write
  checks: write

on:
  push:
    branches: [ "**" ]
    tags: [ "**" ]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      - '.github/CODEOWNERS'
      - '**/*.md'
  workflow_dispatch:
  merge_group:

env:
  build-version-number: 0.0.${{ github.run_number }}  
  docker-image-name: ghcr.io/tonycknight/eveproxy
  
jobs:
  
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
             
      - name: Restore packages
        run: |
          dotnet tool restore
          dotnet restore

      - name: Tests
        run: dotnet test -c Debug  -- --coverage --coverage-output-format cobertura --report-trx

      - name: Consolidate code coverage
        run: dotnet reportgenerator -reports:./TestResults/*.cobertura.xml -targetdir:"./publish/codecoveragesummary" -reporttypes:"MarkdownSummaryGithub"
                    
      - name: Unit test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit test results
          path: ${{ github.workspace }}/TestResults/*.trx
          reporter: dotnet-trx
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Code coverage summary
        run: |
          cat ./publish/codecoveragesummary/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

  sca:
    uses: ./.github/workflows/sca.yml

  build-publish-docker-image:
    name: Build & Publish docker image
    runs-on: ubuntu-latest
    needs:   [ tests, sca ]

    steps:
      - uses: actions/checkout@v7
      
      - name: Set BuildVersion
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          run: echo "build-version-number=$(git describe --tags --dirty)" >> $GITHUB_ENV

      - name: Report version
        run: echo "Building package ${{ env.build-version-number }}" >> $GITHUB_STEP_SUMMARY

      - name: Set Docker image name
        run: |
          echo "docker-image-name=${{ env.docker-image-name }}:v${{ env.build-version-number }}" >> $GITHUB_ENV
                  
      - name: Build docker image
        run: docker build -f Dockerfile -t ${{ env.docker-image-name }} --build-arg BuildVersion=${{ env.build-version-number }} .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR }}

      - name: Push docker image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: docker push ${{ env.docker-image-name }}
